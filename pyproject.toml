[project]
name = "steposcope"
version = "0.1.0"
description = "An educational interactive walker for ISO-10303-21 STEP files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "PySide6-Essentials>=6.7",
    "vtk>=9.3",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "pyflakes>=4.0.3",
    "pylint>=4.1.3",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "vulture>=2.16",
]

[project.scripts]
steposcope = "step_explorer.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "slow: corpus-wide sweeps that iterate over every small STEP model",
]

[tool.uv]
package = true

# Pin discovery so re-syncing (uv sync / uv add) does not fail once running the
# tool has created top-level output/, temp/, etc. alongside the real package.
[tool.setuptools.packages.find]
include = ["step_explorer", "step_explorer.*"]

[tool.setuptools.data-files]
"share/steposcope/media" = ["media/waiting.png", "media/result.png"]
